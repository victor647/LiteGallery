[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "litegallery"
version = "0.1.0"
description = "Windows-first local RAW photo catalog and Adobe workflow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.7",
    "rawpy>=0.24",
    "Pillow>=10.0",
    "psd-tools>=1.9",
    "Send2Trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "luaparser>=4.2"]
build = ["pyinstaller>=6.8"]

[project.scripts]
litegallery = "photo_manager.ui:main"

[tool.setuptools.packages.find]
include = ["photo_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
